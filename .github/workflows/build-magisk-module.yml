# Builds the Magisk module that makes root mode run this fork's engine.
#
# This existed only as a script anybody had to remember to run, so v4.0.0
# shipped five rootful APKs and no module to pair them with. Anyone who
# installed the rooted build had nothing of ours to flash, reached for the
# stock JamesDSP module instead, and got an engine that has never heard of this
# fork's parameter ids: every fork effect silently does nothing while the
# upstream ones work. That is issue #12.
name: Build Magisk module

on:
  push:
    branches: [ master, viper-extras, damon-dsp, 'ccr-*' ]
    paths:
      - 'magisk/**'
      - 'app/src/main/cpp/**'
      - 'buildSrc/src/main/kotlin/AndroidConfig.kt'
      - '.github/workflows/build-magisk-module.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27

      - name: Build and package
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash magisk/build-module.sh

      # module.prop version, every library's alignment, relocations and
      # exported symbols, the scripts' line endings, the zip's paths: the same
      # checks the release workflow runs, kept in one script so the two cannot
      # drift apart on what "good" means.
      - name: Check the module
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash ci/check-module.sh

      - uses: actions/upload-artifact@v4
        with:
          name: damondsp-engine-module
          path: build/damondsp-engine-module.zip
